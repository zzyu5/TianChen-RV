# dir-hygiene CI — experiments/ layout governance gate (org STAGE2, 裁决九.5).
#
# experiments/ is a DATA cell, not a code tree. Three fail-closed lints keep it that way and
# keep the auto-generated INDEX.md in lock-step with the per-cell MANIFESTs:
#
#   ① tools/lint/check_experiments_layout.py     data-only whitelist + sealed/ read-only
#   ② tools/lint/gen_experiments_index.py --check INDEX.md == generator output (idempotent)
#   ③ tools/lint/check_index_consistency.py       INDEX↔MANIFEST↔tree + tracking bidi
#
# Stdlib-Python only; the sole external action is actions/checkout. Every gate is fail-closed
# (non-zero exit = RED). A live injection step proves the whitelist gate actually REJECTS a
# deliberate violation (the pivot's gate-traffic clause: a gate that never catches anything is
# a deletion candidate).
name: dir-hygiene

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  experiments-layout:
    runs-on: ubuntu-latest
    steps:
      # HEAD must be present: ① diffs the tree vs `git diff HEAD` for the sealed/ read-only
      # half, ②/③ use `git ls-files` / `git check-ignore` for the durable-content lens.
      - name: Checkout
        uses: actions/checkout@v4

      # Pure-classifier self-tests (no tree state) — cheap smoke that the lint logic itself
      # is intact before it judges the real tree.
      - name: Lint self-tests (pure classifiers)
        run: |
          python3 tools/lint/check_experiments_layout.py --self-test
          python3 tools/lint/gen_experiments_index.py --self-test
          python3 tools/lint/check_index_consistency.py --self-test

      # ① data-only whitelist + sealed/ read-only (fail-closed).
      - name: Layout gate — experiments/ is data-only, sealed/ immutable
        run: python3 tools/lint/check_experiments_layout.py

      # ② INDEX.md is a pure function of the on-disk MANIFESTs (fail-closed if stale).
      - name: Index-fresh gate — INDEX.md == generator output
        run: python3 tools/lint/gen_experiments_index.py --check

      # ③ bidirectional INDEX↔MANIFEST↔tree consistency + sealed-tracked/interim-untracked (fail-closed).
      - name: Consistency gate — INDEX/MANIFEST/tree + tracking bidi
        run: python3 tools/lint/check_index_consistency.py

      # Live red-team: inject a script (harness code) into the data cell and prove the
      # whitelist gate RED-flags it. If the gate returns 0 on the injected leak it is not
      # fail-closed and this step fails. The probe file is always removed afterwards.
      - name: Injection demo — whitelist gate REJECTS a leaked script
        run: |
          set -u
          PROBE=experiments/active/__ci_gate_probe_leak.py
          printf 'print("gate probe: script leaked into the experiments/ data cell")\n' > "$PROBE"
          if python3 tools/lint/check_experiments_layout.py; then
            rm -f "$PROBE"
            echo "::error::dir-hygiene NOT fail-closed — layout gate returned 0 on an injected script leak."
            exit 1
          fi
          rm -f "$PROBE"
          echo "OK: layout gate REJECTED the injected script leak (fail-closed proven)."
