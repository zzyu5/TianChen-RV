# Falsifier CI — F-2' / S-6 schema.def governance gate (E3 slice, one gate only).
#
# Makes the schema.def gate (`.trellis/scripts/check_schema_gate.py`) CI-executable and
# keeps a live red-team proof that it CATCHES a deliberate violation (the pivot's
# gate-traffic clause: a gate that has never caught anything is a deletion candidate).
#
# Stdlib-Python only; the sole external action is actions/checkout. This wires ONLY the
# F-2' schema.def gate — F-5 fuzz / F-6 independence / per-family regex are later rounds.
name: falsifier-gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  schema-def-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the F-2' gate diffs base..head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hermetic gate logic: report determinism, F-2' path-intersection,
      # additive-vs-breaking classification. No git refs, no repo writes.
      - name: Gate self-test
        run: python3 .trellis/scripts/check_schema_gate.py --self-test

      # [S-6] report gate on the COMMITTED schema.def artifact: recompute the normalized
      # SHA256 and fail if the shape hash drifted with no matching VERSIONLOG line.
      # This fires on EVERY PR that mutates the schema shape without logging it.
      - name: Report gate (committed schema.def shape hash vs VERSIONLOG)
        run: python3 .trellis/scripts/check_schema_gate.py report --check

      # Live red-team: prove the gate actually REJECTS a deliberate violation
      # (hermetic content edit + read-only F-2' onboarding range).
      - name: Red-team proof (gate catches a deliberate violation)
        run: python3 .trellis/scripts/redteam_schema_gate.py --self-test

      # [F-2'] operation gate on the PR diff range: a family-onboarding PR whose diff
      # intersects schema/ is the falsifier firing. PR-only — on push, base..head refs
      # (github.event.before) are unreliable / all-zeros on a new branch.
      - name: F-2' operation gate (onboarding PR diff ∩ schema.def = ∅)
        if: github.event_name == 'pull_request'
        run: |
          python3 .trellis/scripts/check_schema_gate.py gate \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  # [裁决九.2] opponent-fact provenance ⟷ ggml-pin STALE gate. The structured opponent
  # facts the tcrv_rvv.quant_contraction op carries (opponent_vlen_native_floor /
  # block_dot_compute_heavy) are VALUES read off a PINNED ggml tree. This gate fails
  # closed the moment schema/ggml-pin.lock.json is bumped away from the sha those facts
  # were verified against (experiments/sealed/c1-cleanliness/opponent-facts-provenance/
  # opponent-facts.pin.json), forcing a re-verify of the cited line anchors.
  opponent-facts-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hermetic self-test: matching sha -> GREEN, bumped sha -> STALE/RED. Proves the
      # gate discriminates before it judges the committed pin.
      - name: Opponent-facts pin gate self-test
        run: bash tools/lint/check_opponent_facts_pin.sh --self-test

      # Default-path gate on the COMMITTED pin: non-zero exit (STALE/RED or setup error)
      # fails the job. Fires on EVERY PR/push that bumps the ggml pin without re-verifying
      # the opponent-fact provenance.
      - name: Opponent-facts pin gate (provenance pin == ggml-pin.lock.json)
        run: bash tools/lint/check_opponent_facts_pin.sh

  # [裁决九.4] monolith retirement residual gate. Every vec_dot MONOLITH block-dot
  # op-def still in the ODS (RVVOps.td) must be NAMED in
  # schema/monolith-retire-whitelist.v1.json -- either deliberately_retained forever
  # (mxfp4 negative control, q4_0 contraction arm) or pending_retirement under a named
  # batch (q1_0 flat tail, K-quant x5) -- and no retired monolith verifier may linger
  # as a `#if 0` dead-code tomb. An un-whitelisted surviving monolith, a stale whitelist
  # entry, or a verifier tomb fails the job closed ('有名有批次': a monolith lingers only
  # if named AND batched). Stdlib-Python only.
  monolith-retire-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hermetic self-test: proves the classifier DISCRIMINATES (matching -> GREEN,
      # each violation class -- unwhitelisted / stale / no-batch / verifier-tomb -> RED)
      # before it judges the committed tree.
      - name: Monolith-retire gate self-test
        run: python3 tools/lint/check_monolith_retire.py --self-test

      # Default-path gate on the COMMITTED ODS + whitelist: non-zero exit (residual /
      # stale-whitelist / verifier-tomb / setup error) fails the job. Fires on EVERY
      # PR/push that adds a vec_dot monolith op-def without whitelisting it, or leaves a
      # retired verifier as a dead-code tomb.
      - name: Monolith-retire gate (ODS monoliths == whitelist, no #if 0 tombs)
        run: python3 tools/lint/check_monolith_retire.py

  # [G3 裁决一.3] [F-EMIT] direct-emitter bypass gate. Terminal state [K-3b]: the repack
  # front door (typed_repack_gem{v,m}_loop_body) is the SOLE emission authority; a
  # hand-written emitRepackGem{v,m}<fmt> wired into the production dispatch table
  # kBlockDotKernels (RVVToEmitC.cpp) BYPASSES it and is TRANSITIONAL SCAFFOLDING (feeds
  # C_dispatch, never C_construct). Every such bypass must be NAMED in
  # schema/emit-bypass-whitelist.v1.json with a retirement_batch, must be dispatch-wired
  # (not constructed) in schema/coverage-sixstate.v1.json with the direct-emitter
  # provenance marker, and the whitelist is a shrink-only ratchet (baseline_count ==
  # entry count). An un-whitelisted bypass, a bypass over-reported as constructed, a
  # stale whitelist entry, or a ratchet breach fails the job closed. Tracks 旁路存量 -> 0.
  # Stdlib-Python only.
  frontdoor-provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hermetic self-test: proves the classifier DISCRIMINATES (matching -> GREEN, each
      # violation class -- un-whitelisted bypass / stale / ratchet / over-report /
      # missing-provenance / sixstate-unlisted -> RED) before it judges the committed tree.
      - name: Front-door provenance gate self-test
        run: python3 tools/lint/check_frontdoor_provenance.py --self-test

      # Default-path gate on the COMMITTED dispatch table + whitelist + six-state: non-zero
      # exit (un-whitelisted bypass / over-report / stale / ratchet / setup error) fails the
      # job. Fires on EVERY PR/push that wires a new emitRepackGem* direct emitter into
      # kBlockDotKernels without whitelisting it, or reports a bypass cell as constructed.
      - name: Front-door provenance gate ([F-EMIT] bypass == whitelist, no over-report)
        run: python3 tools/lint/check_frontdoor_provenance.py

  # [G3-cert-hardening 裁决] cert THREE-REQUIREMENTS gate (防复发入宪). The M2c 误诊 root
  # cause: a q4_K repack-GEMM 'byte-exact' claim backed by (1) a row-quant oracle against a
  # mat-quant/interleaved dispatch (wrong input path) and (2) a self-comparing / shared-impl
  # reference (hollow certificate) whose corpus never exercised the dmin-term. This gate
  # fails closed unless every NUMERICAL-CORRECTNESS cert declared in
  # schema/cert-lineage.v1.json satisfies -- for a claim='full' -- all THREE requirements:
  # ① corpus complete (every arithmetic term of the fold EXERCISED, none merely declared);
  # ② input path same-origin (oracle quantizer == tested-dispatch quantizer AND the tested
  #    path is the real production dispatch, link-by-link); ③ oracle independent (the
  #    reference does NOT share the被测物's read impl -- self-compare / shared-impl is
  #    hollow). An undeclared field, a fold's mandatory term narrowed away, a corpus gap not
  #    marked partial, a cross-quantizer oracle, or a hollow oracle backing a full claim
  # fails the job closed. Changes NO kernel / NO numerics -- rule + CI only. Stdlib-Python.
  cert-requirements-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hermetic self-test: proves the classifier DISCRIMINATES (compliant claim=full ->
      # GREEN; each violation class -- corpus-incomplete / under-declared / input-path-not-
      # same-origin / not-dispatch-faithful / hollow-cert / undeclared / typo / duplicate ->
      # RED; honest partial + failure certs -> GREEN) before it judges the committed registry.
      - name: Cert-requirements gate self-test
        run: python3 tools/lint/check_cert_requirements.py --self-test

      # Default-path gate on the COMMITTED cert-lineage registry: non-zero exit (a cert whose
      # declared lineage fails the three requirements for its claim, or setup error) fails the
      # job. Fires on EVERY PR/push that adds or edits a numeric-correctness cert declaration
      # that over-claims (claim=full it cannot back).
      - name: Cert-requirements gate (three requirements per claim=full cert)
        run: python3 tools/lint/check_cert_requirements.py

  # [判定书 §3 轴B 裁决③] RETIRED-INDEX gate (机检化 · de-memoized single query point).
  # schema/retired-index.generated.json is MACHINE-GENERATED by gen_retired_index.py from
  # the THREE retirement ledgers (.td RETIRED NOTE markers + monolith-retire-whitelist
  # retired_ledger + emit-bypass-whitelist retired_ledger). This gate fails closed unless
  # (1) the committed index is FRESH (== the in-memory rebuild -- nobody edited a source
  # ledger without regenerating), (2) every entry's FOUR REQUIREMENTS (format / op /
  # retirement_basis / alternative_path / restore_ref) are non-empty, and (3) COVERAGE:
  # every RETIRED vec_dot monolith -- derived INDEPENDENTLY as {vec_dot rows in
  # schema/coverage-sixstate.v1.json} MINUS {surviving ODS monolith formats in the
  # whitelist} -- is in the index. A monolith retired without being indexed, a hand-edit,
  # or a hollow (empty-requirement) entry fails the job closed. Stdlib-Python only.
  retired-index-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hermetic self-test: proves the gate DISCRIMINATES (fresh + four-req + coverage-equal
      # -> GREEN; each violation class -- stale-index / empty-requirement / retired-but-
      # unindexed / surviving-listed-as-retired -> RED) before it judges the committed tree.
      - name: Retired-index gate self-test
        run: python3 tools/lint/check_retired_index.py --self-test

      # Default-path gate on the COMMITTED index + the three source ledgers + coverage-sixstate:
      # non-zero exit (drift / empty four-requirement / coverage gap / setup error) fails the
      # job. Fires on EVERY PR/push that retires a vec_dot monolith without back-filling the
      # index, or hand-edits the machine-generated index.
      - name: Retired-index gate (fresh index, four requirements, full vec_dot coverage)
        run: python3 tools/lint/check_retired_index.py
